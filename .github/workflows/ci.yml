name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install
        run: bun install --frozen-lockfile
        env:
          MOTION_TOKEN: ${{ secrets.MOTION_TOKEN }}

      - name: Check
        run: bun check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
