name: Publish

on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  linux:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-x64, cpu: x64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64, cpu: arm64 }
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          MOTION_TOKEN: ${{ secrets.MOTION_TOKEN }}

      # The binary compiles in its package's name, so in-app updates install this package.
      - name: Name the package for this platform
        run: |
          bun -e '
            const pkg = await Bun.file("package.json").json();
            Object.assign(pkg, { name: `${pkg.name}-${{ matrix.platform }}`, os: ["linux"], cpu: ["${{ matrix.cpu }}"] });
            await Bun.write("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Build CLI
        run: bun run build:cli
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Pack and check the standalone executable
        run: |
          npm pack --ignore-scripts
          smoke_dir="$(mktemp -d)"
          tar -xzf lostintangent-toy-box-${{ matrix.platform }}-*.tgz -C "$smoke_dir"
          test "$("$smoke_dir/package/toy-box" --version)" = "$(jq -r .version package.json)"
          bash .github/smoke-serve.sh "$smoke_dir/package/toy-box"
          cp "$smoke_dir/package/toy-box" toy-box-${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            toy-box-${{ matrix.platform }}
            lostintangent-toy-box-${{ matrix.platform }}-*.tgz

  publish:
    needs: linux
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Prepare release
        id: release
        run: |
          bun run - <<'BUN'
          import { $ } from "bun";
          import { appendFileSync } from "node:fs";

          const { name, version } = await Bun.file("package.json").json();
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error("Publish requires a stable package version");
          const tag = `v${version}`;
          const changelog = await Bun.file("CHANGELOG.md").text();
          const headings = [...changelog.matchAll(/^##[ \t]+(.+)$/gm)];
          const matches = headings.filter(heading => heading[1].match(/(?:^|\s)v(\d+\.\d+\.\d+)(?=\s|$)/)?.[1] === version);
          if (matches.length !== 1) throw new Error(`Expected exactly one CHANGELOG.md section for v${version}`);
          const heading = matches[0];
          const next = headings[headings.indexOf(heading) + 1];
          const notes = changelog.slice(heading.index + heading[0].length, next?.index).trim();
          if (!notes) throw new Error(`Release notes for v${version} are empty`);

          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`);
          if (response.ok) throw new Error(`${name}@${version} is already published`);
          if (response.status !== 404) throw new Error(`Cannot verify npm version availability: HTTP ${response.status}`);
          const existingTag = await $`git ls-remote --tags origin refs/tags/${tag}`.text();
          if (existingTag.trim()) throw new Error(`Tag ${tag} already exists`);

          await Bun.write(`${process.env.RUNNER_TEMP}/release-notes.md`, `${notes}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=${tag}\n`);
          BUN

      - uses: actions/setup-node@v7
        with:
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          MOTION_TOKEN: ${{ secrets.MOTION_TOKEN }}

      - name: Check
        run: bun check

      - name: Test
        run: bun run test

      - name: Build CLI
        run: bun run build:cli
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Pack and check the standalone executable
        id: package
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm pack --ignore-scripts
          package_file="lostintangent-toy-box-$RELEASE_VERSION.tgz"
          smoke_dir="$(mktemp -d)"
          tar -xzf "$package_file" -C "$smoke_dir"
          built_version="$(cd "$smoke_dir" && ./package/toy-box --version)"
          test "$built_version" = "$RELEASE_VERSION"
          bash .github/smoke-serve.sh "$smoke_dir/package/toy-box"
          cp "$smoke_dir/package/toy-box" toy-box-darwin-arm64
          echo "file=$package_file" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v5
        with:
          path: linux
          merge-multiple: true

      # The Linux packages publish before the main one, which marks the release as published, and skip
      # any version already on npm, so a re-run after a partial publish finishes the release.
      - name: Publish Linux packages to npm
        run: |
          for package in linux/*.tgz; do
            url="$(tar -xOzf "$package" package/package.json | jq -r '"https://registry.npmjs.org/\(.name | @uri)/\(.version)"')"
            status="$(curl -sS -o /dev/null -w '%{http_code}' "$url")"
            case "$status" in
              200) echo "$url is already published" ;;
              404) npm publish "$package" --ignore-scripts ;;
              *) echo "Cannot verify $url: HTTP $status" && exit 1 ;;
            esac
          done

      - name: Publish to npm
        env:
          RELEASE_PACKAGE: ${{ steps.package.outputs.file }}
        run: npm publish "$RELEASE_PACKAGE" --ignore-scripts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_PACKAGE: ${{ steps.package.outputs.file }}
        run: |
          gh release create "$RELEASE_TAG" toy-box-darwin-arm64 linux/toy-box-linux-* "$RELEASE_PACKAGE" \
            --target "$GITHUB_SHA" --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
